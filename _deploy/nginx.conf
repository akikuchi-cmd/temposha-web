# 株式会社テンポ社サイト — コンテナ内 nginx 設定（/opt/temposha/nginx.conf）
# temposha.sys-app.jp が本番アドレスなので、検索エンジンには載せる（noindex は付けない）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / { try_files $uri $uri/ =404; }

    location /images/ { expires 30d; add_header Cache-Control "public"; }
    location = /logo.png { expires 30d; add_header Cache-Control "public"; }
    location ~ \.(css|js)$ { expires 7d; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
